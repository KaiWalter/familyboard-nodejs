openapi: 3.0.3
info:
  title: Confidential Sign-In API
  version: 0.1.0
  description: Endpoints enabling confidential authorization code sign-in flow.
servers:
  - url: http://localhost:3000
paths:
  /signin:
    get:
      summary: Initiate sign-in
      description: Generates state and returns authorization URL (JSON when ?format=json) or redirects for browser user agents. Supports optional forceConsent prompt.
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json] }
        - in: query
          name: forceConsent
          schema: { type: string, enum: ['1'] }
      responses:
        '302':
          description: Redirect to authorization server
          headers:
            Location:
              schema:
                type: string
              description: Authorization server URL containing state parameter
        '200':
          description: JSON payload (when format=json)
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl: { type: string }
                  state: { type: string }
        '400':
          description: Invalid configuration / rate limit exceeded
  /callback:
    get:
      summary: Authorization server redirect handler
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: false
        - in: query
          name: state
          schema:
            type: string
          required: false
        - in: query
          name: error
          schema:
            type: string
          required: false
      responses:
        '200': { description: Successful code exchange }
        '400': { description: State mismatch, missing code/state, or scope mismatch }
        '500': { description: Token exchange failure }
  /signout:
    post:
      summary: Invalidate current session
      description: Clears persisted tokens and marks session terminated.
      responses:
        '200': { description: Sign-out successful }
        '400': { description: No active session }
  /api/auth/rotate:
    post:
      summary: Manual token refresh
      description: Uses stored refresh token to acquire new access token. Test mode may simulate.
      responses:
        '200': { description: Refresh succeeded }
        '400': { description: No user session or no refresh token }
        '500': { description: Refresh failed }
  /status/auth:
    get:
      summary: Auth status
      description: Provides current authentication state details (sanitized).
      responses:
        '200':
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  expiresInSeconds:
                    type: integer
                  rotation:
                    type: integer
  /protected/example:
    get:
      summary: Example protected resource
      responses:
        '200':
          description: Authorized access
        '401':
          description: Not authenticated
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: sid
  schemas:
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        expiresInSeconds:
          type: integer
        rotation:
          type: integer
security: []
