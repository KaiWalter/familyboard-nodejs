openapi: 3.1.0
info:
  title: FamilyBoard Photo & Calendar API
  version: 0.1.0
  description: Minimal API for kiosk SPA providing configuration, calendar events, photo listing, and auth status.
servers:
  - url: http://localhost:3000
paths:
  /api/status:
    get:
      summary: Auth and cache status
      operationId: getStatus
      responses:
        '200':
          description: Current auth/token/cache status
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [OK, Refreshing, Warning, Error]
                      expiresAt:
                        type: string
                        format: date-time
                      remainingMinutes:
                        type: number
                  calendarCacheAgeSeconds:
                    type: number
                  photoCount:
                    type: integer
  /api/config:
    get:
      summary: Retrieve current configuration
      operationId: getConfig
      responses:
        '200':
          description: Current AppConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
    put:
      summary: Replace configuration
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfig'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/events:
    get:
      summary: Get 21-day window of events
      operationId: getEventsWindow
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Optional start date (defaults to today local)
        - in: query
          name: days
          schema:
            type: integer
            default: 21
            minimum: 1
            maximum: 30
      responses:
        '200':
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
  /api/photos:
    get:
      summary: List photos available for rotation
      operationId: getPhotos
      responses:
        '200':
          description: Photo assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoAsset'
components:
  schemas:
    CalendarEvent:
      type: object
      required: [id, title, startUtc, endUtc, allDay, sourceCalendarId, localizedStart, localizedEnd, displayDateKey]
      properties:
        id: { type: string }
        title: { type: string }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        allDay: { type: boolean }
        sourceCalendarId: { type: string }
        localizedStart: { type: string, format: date-time }
        localizedEnd: { type: string, format: date-time }
        displayDateKey: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        multiDayAllDay: { type: boolean }
        continuation: { type: boolean }
    AppConfig:
      type: object
      required: [oneDriveFolderId, calendar, layout, rotation]
      properties:
        oneDriveFolderId: { type: string }
        calendar:
          type: object
          required: [calendarIds, locale, timezone]
          properties:
            calendarIds:
              type: array
              minItems: 1
              maxItems: 5
              items: { type: string }
            locale: { type: string }
            timezone: { type: string }
            weekdayAbbrevOverride:
              type: object
              additionalProperties: { type: string }
        layout:
          type: object
          required: [goldenRatioEnabled, ratio]
          properties:
            goldenRatioEnabled: { type: boolean }
            ratio:
              type: number
              minimum: 1.568
              maximum: 1.668
        rotation:
          type: object
          required: [intervalSeconds]
          properties:
            intervalSeconds:
              type: number
              enum: [90]
            lastIndex:
              type: number
              minimum: 0
    PhotoAsset:
      type: object
      required: [id, fileName, url]
      properties:
        id: { type: string }
        fileName: { type: string }
        url: { type: string }
        orientation:
          type: string
          enum: [landscape, portrait]
        width: { type: integer }
        height: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: string }
security: []
