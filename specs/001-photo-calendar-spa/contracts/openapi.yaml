openapi: 3.1.0
info:
  title: FamilyBoard Photo & Calendar API
  version: 0.1.0
  description: |
    Minimal API for kiosk SPA providing configuration, calendar events, photo listing, and auth status.
    Interactive-only authentication model:
      - Authorization Code + Refresh Token using delegated user consent.
      - No client credentials fallback; protected endpoints require a user session.
    Interactive endpoints: /signin, /callback, /signout, /api/auth/rotate.
servers:
  - url: http://localhost:3000
paths:
  /api/status:
    get:
      summary: Auth and cache status
      operationId: getStatus
      responses:
        '200':
          description: Current auth/token/cache status
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    $ref: '#/components/schemas/AuthStatus'
                  eventsCacheAgeMs:
                    type: number
                  photosCacheAgeMs:
                    type: number
  /api/config:
    get:
      summary: Retrieve current configuration
      operationId: getConfig
      responses:
        '200':
          description: Current AppConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
    put:
      summary: Replace configuration
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfig'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/events:
    get:
      summary: Get 21-day window of events
      operationId: getEventsWindow
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Optional start date (defaults to today local)
        - in: query
          name: days
          schema:
            type: integer
            default: 21
            minimum: 1
            maximum: 30
      responses:
        '200':
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
  /api/photos:
    get:
      summary: List photos available for rotation
      operationId: getPhotos
      responses:
        '200':
          description: Photo assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoAsset'
  /signin:
    get:
      summary: Initiate interactive sign-in
      description: Generates a single-use state and returns (or redirects to) an authorization URL. Uses exactly configured scopes (no implicit offline_access addition).
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json] }
          description: Force JSON response instead of 302 redirect for browser UAs.
        - in: query
          name: forceConsent
          schema: { type: string, enum: ['1'] }
          description: Adds prompt=consent to authorization request.
      responses:
        '200':
          description: Authorization URL JSON payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl: { type: string }
                  state: { type: string }
        '302':
          description: Redirect to authorization server (browser UA without ?format=json)
        '429': { description: Rate limited }
        '500': { description: Misconfiguration or client init failure }
  /callback:
    get:
      summary: Authorization redirect handler
      parameters:
        - in: query
          name: code
          schema: { type: string }
          required: true
        - in: query
          name: state
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Successful code exchange & persistence (JSON mode when Accept: application/json or ?format=json)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  redirect: { type: string, description: "Target root path '/' when kiosk redirect suppressed" }
        '400': { description: Invalid or missing state / scope mismatch }
        '500': { description: Token exchange failure }
        '302': { description: Successful code exchange followed by redirect to root '/' }
  /signout:
    post:
      summary: Clear persisted tokens
      responses:
        '200': { description: Sign-out successful (tokens cleared) }
  /api/auth/rotate:
    post:
      summary: Manually refresh access token (user tokens only)
      responses:
        '200': { description: Refresh succeeded }
        '400': { description: No user session or no refresh token }
        '500': { description: Refresh failed }
components:
  schemas:
    CalendarEvent:
      type: object
      required: [id, title, startUtc, endUtc, allDay, sourceCalendarId, localizedStart, localizedEnd, displayDateKey]
      properties:
        id: { type: string }
        title: { type: string }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        allDay: { type: boolean }
        sourceCalendarId: { type: string }
        localizedStart: { type: string, format: date-time }
        localizedEnd: { type: string, format: date-time }
        displayDateKey: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        multiDayAllDay: { type: boolean }
        continuation: { type: boolean }
    AppConfig:
      type: object
      required: [oneDriveFolderId, calendar, layout, rotation]
      properties:
        oneDriveFolderId: { type: string }
        calendar:
          type: object
          required: [calendarIds, locale, timezone]
          properties:
            calendarIds:
              type: array
              minItems: 1
              maxItems: 5
              items: { type: string }
            locale: { type: string }
            timezone: { type: string }
            weekdayAbbrevOverride:
              type: object
              additionalProperties: { type: string }
        layout:
          type: object
          required: [goldenRatioEnabled, ratio]
          properties:
            goldenRatioEnabled: { type: boolean }
            ratio:
              type: number
              minimum: 1.568
              maximum: 1.668
        rotation:
          type: object
          required: [intervalSeconds]
          properties:
            intervalSeconds:
              type: number
              enum: [90]
            lastIndex:
              type: number
              minimum: 0
    PhotoAsset:
      type: object
      required: [id, fileName, url]
      properties:
        id: { type: string }
        fileName: { type: string }
        url: { type: string }
        orientation:
          type: string
          enum: [landscape, portrait]
        width: { type: integer }
        height: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: string }
    AuthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [OK, Refreshing, Warning, Error, NO_TOKEN]
        expiresAt: { type: string, format: date-time }
        remainingMinutes: { type: number }
        rotation: { type: number }
        configured: { type: boolean }
        hasRefreshToken: { type: boolean }
        tokenType:
          type: string
          enum: [user, application]
security: []
